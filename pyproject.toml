# ============================================================================
# Build System & Package Metadata (PEP 517 / PEP 621 / PEP 735)
# ============================================================================

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "timerun"
description = "Single-file Python timing library (stdlib only). Measures wall-clock and CPU time for blocks/calls with optional metadata."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "HH-MWB", email = "h.hong@mail.com" }]
keywords = [
    "time",
    "measurement",
    "measurements",
    "elapsed",
    "stopwatch",
    "timer",
    "performance",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Monitoring",
]
dynamic = ["version"]

[project.urls]
Homepage = "https://hh-mwb.github.io/timerun/"
Documentation = "https://hh-mwb.github.io/timerun/"
Repository = "https://github.com/HH-MWB/timerun"
Issues = "https://github.com/HH-MWB/timerun/issues"
Changelog = "https://github.com/HH-MWB/timerun/releases"
PyPI = "https://pypi.org/project/timerun"

[dependency-groups]
dev = [
    "behave",
    "coverage",
    "pip-audit",
    "pre-commit",
]
docs = [
    "zensical",
]
build = [
    "build",
    "twine",
]

# ============================================================================
# Build Backend
# ============================================================================

[tool.setuptools]
py-modules = ["timerun"]
license-files = ["LICENSE"]

[tool.setuptools.dynamic]
version = { attr = "timerun.__version__" }

# ============================================================================
# Linting & Formatting
# ============================================================================

[tool.ruff]
target-version = "py310"
line-length = 79
fix = true
force-exclude = true

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "CPY001",  # Missing copyright notice at top of file
    "D203",    # Incompatible with D211 (no-blank-line-before-class)
    "D213",    # Incompatible with D212 (multi-line-summary-first-line)
]

[tool.ruff.lint.per-file-ignores]
"features/steps/*.py" = ["S101"]

[tool.ruff.lint.isort]
combine-as-imports = true
known-first-party = ["timerun"]

[tool.ruff.lint.mccabe]
max-complexity = 5

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.flake8-type-checking]
strict = true

[tool.pylint.main]
py-version = "3.10"
fail-under = 10.0
load-plugins = ["pylint.extensions.mccabe"]

[tool.pylint.messages_control]
disable = [
    "not-callable",  # false positive for behave's when/then decorators
]

[tool.pylint.format]
max-line-length = 79

[tool.pylint.imports]
known-first-party = ["timerun"]

[tool.pylint.design]
max-args = 4
max-attributes = 5
max-complexity = 5
max-returns = 3
max-branches = 4
max-statements = 20

# ============================================================================
# Type Checking
# ============================================================================

[tool.mypy]
python_version = "3.10"
strict = true
extra_checks = true
local_partial_types = true

# Stricter checks beyond default strict mode
disallow_any_decorated = true
disallow_any_explicit = true
disallow_any_unimported = true
strict_equality_for_none = true
warn_unreachable = true

# Extended error codes
enable_error_code = [
    "deprecated",
    "exhaustive-match",
    "explicit-override",
    "ignore-without-code",
    "possibly-undefined",
    "redundant-expr",
    "redundant-self",
    "truthy-bool",
    "truthy-function",
    "truthy-iterable",
    "unimported-reveal",
    "unused-awaitable",
]

# Output formatting
show_column_numbers = true
show_error_codes = true
show_error_context = true
pretty = true

[[tool.mypy.overrides]]
module = [
    "behave",
    "behave.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "features.*"
ignore_errors = true

[tool.pyright]
pythonVersion = "3.10"
venvPath = "."
venv = ".venv"

include = ["timerun.py"]
exclude = ["features"]

typeCheckingMode = "strict"
deprecateTypingAliases = true

# Diagnostic rules elevated to error beyond strict mode
reportCallInDefaultInitializer = "error"
reportImplicitOverride = "error"
reportImplicitStringConcatenation = "error"
reportImportCycles = "error"
reportMissingSuperCall = "error"
reportPropertyTypeMismatch = "error"
reportUninitializedInstanceVariable = "error"
reportUnnecessaryCast = "error"
reportUnnecessaryComparison = "error"
reportUnnecessaryContains = "error"
reportUnnecessaryIsInstance = "error"
reportUnnecessaryTypeIgnoreComment = "error"
reportUnusedCallResult = "error"

# ============================================================================
# Security Analysis
# ============================================================================

[tool.bandit]
exclude_dirs = ["features/steps"]

[tool.bandit.try_except_pass]
check_typed_exception = true

# ============================================================================
# Spelling & Quality
# ============================================================================

[tool.codespell]
check-filenames = true
check-hidden = true

# ============================================================================
# Testing & Coverage
# ============================================================================

[tool.behave]
show_snippets = false
show_skipped = false

[tool.coverage.run]
source = ["timerun"]
relative_files = true

[tool.coverage.report]
fail_under = 100
show_missing = true
